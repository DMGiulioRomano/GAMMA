-   nome_sezione: "I. Nascita Lenta di Cluster"
    durata: 154
    layers:
      - nome_layer: "salita di gamma"
        lifespan: [0, 0.76]  
        num_attivazioni: 20      
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 2], distribution: "uniform"}
            registro:         {range: [1, 3], distribution: "uniform"}
            durata_armonica:  {range: [24, 32]}
            densita_cluster:  {range: [2, 4]} 
            onset_jitter: { range: [0.0, 0.0] }
            dinamica: 'ff'
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            inviluppo_attacco: 'lineare'
        stato_finale:
            dinamica: 'mf'
            ottava:           {range: [3, 8],      interp_shape: 2.0}
            registro:         {range: [1, 20], distribution: "uniform"}
            durata_armonica:  {range: [12, 24]} #,     interp_shape: 2.0}
            densita_cluster:  {range: [4, 9]} #, interp_shape: 2.0}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}

      - nome_layer: "scintillii"
        lifespan: [.5, .74]  
        leeway_fine_layer: 5 
        usa_safety_buffer: false 
        num_attivazioni: 50      
        timing_model:
            type: "stochastic"
        stato_iniziale:
            dinamica: 'ppp'
            ottava:           {range: [5, 8], distribution: "uniform"}
            registro:         {range: [1, 8], distribution: "uniform"}
            durata_armonica:  {range: [.8, 4]}
            offset_registro: { range: [-3, 3] }
            densita_cluster:  {range: [5, 10]}
            onset_jitter: { range: [2.3, 6.6] }
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}
            inviluppo_attacco: 'lineare'
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
        stato_finale:
            dinamica: 
                value: 'ff'
                interp_shape: 2.0
            ottava:           {range: [5, 8], distribution: "uniform"}
            registro:         {range: [1, 50], distribution: "uniform"}
            durata_armonica:  {range: [.72, 2.4]}
            offset_registro: { range: [-10, 10] }
            onset_jitter: {range: [0.6, 1.6]}
            densita_cluster:  {range: [10, 40]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}
            inviluppo_attacco: 'impulsivo'
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
      - nome_layer: "scampanello"
        lifespan: [0.76, 1]  
        num_attivazioni: 30     
        timing_model:
            type: "ritardando"
            shape: 2.4
        stato_iniziale:
            ottava:           {range: [2, 8]}
            registro:         {range: [1, 20]}
            durata_armonica:  {range: [9, 12]}
            densita_cluster:  {range: [40, 60]} 
            onset_jitter: {range: [0, 0.01]}
            dinamica: 'ff'
            tipo_ritmi:
              explicit_values: [1,2,1,2,1]
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            inviluppo_attacco: 'impulsivo-fiodena'
            senso_movimento: { value: -1 }
        stato_finale:
            dinamica: 'f'
            onset_jitter: { range: [0.3, 1.6] }
            ottava:           {range: [3, 7]}
            registro:         {range: [1, 20]}
            durata_armonica:  {range: [4.5, 9]}
            densita_cluster:  {range: [1, 7], interp_shape: 0.1}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}

-   nome_sezione: "II. solo ripresaglissante"
    offset_inizio: -14
    durata: 150
    ratio_temporale: 1 #.3  
    layers: 
      - nome_layer: "solista"
        lifespan: [0, .44] 
        num_attivazioni: 4   
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [3,3]}
            registro:         {range: [10,11]}
            durata_armonica:  {range: [30,36]}
            densita_cluster:  {range: [1, 2]} 
            dinamica: 'ppp'
            tipo_ritmi:       
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            moltiplicatore_durata: { choices: [1.0, 1.1, 1.2] }
            offset_registro: { range: [-1, 1] }
        stato_finale:
            tipo_ritmi:       
              explicit_values: [3, 6, 4, 7, 11, 15, 3, 2, 4,5,17,3,8]
            dinamica: 'p'
            ottava:           {range: [3,3]}
            registro:         {range: [1,40]}
            durata_armonica:  {range: [21, 27]}
            densita_cluster:  {range: [1, 7], interp_shape: 2.0 }
            offset_registro: { range: [-10, 3] }
      - nome_layer: "glissando"
        lifespan: [0.25, 1] 
        num_attivazioni: 10
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [3,4]}
            registro:         {distribution: 'normal', mean: 10, std: 2 }
            offset_registro: { range: [-10, 0] }
            durata_armonica:  {range: [20,30]}
            densita_cluster:  {range: [1, 2]} 
            dinamica: 'ppp'
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]} 
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
        stato_finale:
            dinamica: 'p'
            ottava:           {range: [3,4]}
            registro:         {distribution: 'normal', mean: 10, std: 20 }
            offset_registro: { range: [-30, 0] , interp_shape: .7}
            durata_armonica:  {range: [10, 20]}
            densita_cluster:  {range: [3, 7]}
      - nome_layer: "Nubi sparsissime"
        num_attivazioni: 12
        usa_safety_buffer: false            
        lifespan: [.65,.7]
        timing_model: { type: "stochastic" }
        stato_iniziale:
            moltiplicatore_durata:
                choices: [2.3, 2.0, 1.0]
            ottava: { range: [8, 8] }
            registro: { mean: 14, std: 4 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.1, 0.4] }
            nonlinear_mode: { choices: [0] }
            onset_jitter: { range: [0.4, 2.7] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [10, 20] }
            inviluppo_attacco: 'triangolo'
        stato_finale:
            moltiplicatore_durata:
                choices: [2.3, 2.0, 1.0]
            ottava: { range: [8, 8] }
            registro: { mean: 14, std: 30, intershape: 2.0 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.1, 0.4] }
            nonlinear_mode: { choices: [0] }
            onset_jitter: { range: [0.4, 2.7] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [10, 20] }
            inviluppo_attacco: 'triangolo'

      - nome_layer: "Nubi Sparse"
        num_attivazioni: 35
        usa_safety_buffer: false            
        lifespan: [.7,1]
        timing_model: { type: "stochastic" }
        stato_iniziale:
            moltiplicatore_durata:
                choices: [1.2, 2.0, 1.0]
            ottava: { range: [7, 8] }
            registro: { mean: 30, std: 2 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.4, 1.7] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [10, 20] }
            inviluppo_attacco: 'impulsivo'
        stato_finale:            
            moltiplicatore_durata: 
                choices: [3.0, 2.0, 4.0]
            ottava: { range: [7, 8] }
            registro: { mean: 30, std: 25 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.2, 0.8]}
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'triangolo'

