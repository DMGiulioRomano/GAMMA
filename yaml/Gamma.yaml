-   nome_sezione: "III. Dalle nubi allo sciame"
    offset_inizio: -15
    durata: 60
    ratio_temporale: 1 #.3  
    layers: 
      - nome_layer: "Nubi Sparse verso sciame"
        usa_safety_buffer: false            
        leeway_fine_layer: 20     
        num_attivazioni: 30
        lifespan: [0,1]
        timing_model: { type: "accelerando", shape: 2.0 }
        stato_iniziale:
            moltiplicatore_durata: 
                choices: [3.0, 1.0, 4.0]
            ottava: { range: [7, 8] }
            registro: { range: [12, 45] }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [.08, 0.18] }
            tipo_ritmi:       {choices: ['medi', 'misti'], weights: [0.2, 0.8]}
            densita_cluster: { range: [4, 12] }
        stato_finale:
            moltiplicatore_durata:
                choices: [1.0, 1.0, 1.0]
            ottava: { range: [6, 7] }
            registro: { range: [1, 50] }
            dinamica: 'pp'
            durata_armonica: { range: [.3, 1]}
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.4, 1.7] }
            tipo_ritmi:       {choices: ['medi', 'misti'], weights: [0.8, 0.2]}
            densita_cluster: { range: [14, 20] }
            inviluppo_attacco: 'triangolo'
      - nome_layer: "sciame"
        leeway_fine_layer: 30     
        usa_safety_buffer: false            
        num_attivazioni: 5
        lifespan: [0,1]
        timing_model: { type: "stochastic" }
        stato_iniziale:
            moltiplicatore_durata: 
                choices: [1.5, 2.0, 3.0]
            ottava: { range: [6, 7] }
            registro: { mean: 25, std: 10 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.2, 0.8]}
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'impulsivo-ease'
        stato_finale:
            moltiplicatore_durata:
                choices: [1.0, 2.0, 1.0]
            ottava: { range: [8, 9] }
            registro: { mean: 25, std: 2 }
            dinamica: 'p'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.4, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [5, 10] }          

-   nome_sezione: "IV. Rottura"
    durata: 80
    offset_inizio: -60
    ratio_temporale: 1 #.3  
    layers: 
      - nome_layer: "impulso"
        num_attivazioni: 13
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 8]}
            registro:         {range: [1, 3]}
            dinamica: 'ppp'
            durata_armonica:  {range: [20, 30]}
            densita_cluster:  {range: [2, 5]}
            tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.9, 0.1]}
            nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
        stato_finale:
            ottava:           {range: [0, 8]}
            registro:         {range: [1, 50]}
            dinamica: 
                value: 'ff'
                interp_shape: 2.0
            durata_armonica:  {range: [6, 10]} 
            densita_cluster:  {range: [5, 10]}
            tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.2, 0.8]}
            nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}
      - nome_layer: "impulso grave"
        lifespan: [.7,1]
        num_attivazioni: 4
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 1]}
            registro:         {range: [1, 3]}
            dinamica: 'ppp'
            durata_armonica:  {range: [20, 30]}
            densita_cluster:  {range: [1, 2]}
            tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.9, 0.1]}
            nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
        stato_finale:
            ottava:           {range: [0, 1]}
            registro:         {range: [1, 50]}
            dinamica: 
                value: 'ff'
                interp_shape: 2.0
            durata_armonica:  {range: [6, 10]} 
            densita_cluster:  {range: [2, 5]}
            tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.2, 0.8]}
            nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}


-   nome_sezione: "V. Cluster"
    offset_inizio: -0.3
    durata: 50
    ratio_temporale: 1 #.3  
    layers: 
      - nome_layer: "cluster"
        #veteranMode: true
        num_attivazioni: 1
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_unico:
            ottava:           {range: [0,8]}
            registro:         {range: [1,50] }
            offset_registro: { range: [-7, 0] }
            durata_armonica:  {range: [10,15]}
            densita_cluster:  {range: [200, 250]}
            moltiplicatore_durata:
                choices: [2.3, 2.0, 1.0]
            dinamica: 'f'
            nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
            inviluppo_attacco: 'mega-impulsivo'
            tipo_ritmi:  
              explicit_values: [1,2,1]

-   nome_sezione: "VI. Ultra glissando"
    offset_inizio: -30
    durata: 110
    ratio_temporale: 1 #.3  
    layers: 
      - nome_layer: "ultra glissando"
        lifespan: [0, .75] 
        num_attivazioni: 6
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [5,7]}
            registro:         { mean: 10, std: 20 }
            offset_registro: { range: [-3, 0] }
            durata_armonica:  {range: [10,15]}
            densita_cluster:  {range: [7, 10]} 
            dinamica: 'p'
            onset_jitter: { range: [.5, 6] }
            tipo_ritmi:       {choices: ['misti', 'medi'], weights: [0.8, 0.2]} 
            nonlinear_mode:   {choices: [2, 1], weights: [0.8, 0.2]}
        stato_finale:
            dinamica: 'ppp'
            durata_armonica:  {range: [0,6]}
            ottava:           {range: [3,5]}
            registro:         { mean: 10, std: 5 }
            offset_registro: { range: [-20, 0] }
            onset_jitter: { range: [.5, 6] }
            densita_cluster:  {range: [2, 4]}
            nonlinear_mode:   {choices: [3, 0], weights: [0.8, 0.2]}
      - nome_layer: "sciame"
        leeway_fine_layer: 30     
        usa_safety_buffer: false            
        num_attivazioni: 12
        lifespan: [0,.5]
        timing_model: { type: "rallentando", shape: 2.0 }
        stato_iniziale:
            moltiplicatore_durata: 
                choices: [1.0, 2.0, 1.0]
            ottava: { range: [7, 8] }
            registro: { mean: 25, std: 10 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.2, 0.8]}
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'triangolo'
        stato_finale:
            moltiplicatore_durata:
                choices: [1.0, 2.0, 1.0]
            ottava: { range: [8, 9] }
            registro: { mean: 25, std: 2 }
            dinamica: 'p'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.4, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [5, 10] }          