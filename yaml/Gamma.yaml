-   nome_sezione: "lavori in corso.."
    durata: 40
    ratio_temporale: 1
    layers:
      - nome_layer: "cluster"
        num_attivazioni: 0
        timing_model:
            type: "accelerando"
            shape: .20
        stato_iniziale:
            ottava:           {range: [0, 9], distribution: "uniform"}
            registro:         {range: [1, 50], distribution: "uniform"}
            dinamica: 'fff'
            durata_armonica:  {range: [7, 10]}
            densita_cluster:  {range: [100, 200]}
            tipo_ritmi:       
                explicit_values: [1,2,3]

            nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
            moltiplicatore_durata: { choices: [1.0, 1.0, 1.0] }
            inviluppo_attacco: 'impulsivo-ease'
        stato_finale:
            ottava:           {range: [3, 3], distribution: "uniform"}
            registro:         {range: [1, 10], distribution: "uniform"}
            dinamica: 'p'
            durata_armonica:  {range: [6, 10]} 
            densita_cluster:  {range: [15, 20]}
            nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}
      - nome_layer: "momento angolare"
        lifespan: [0.3, 1]  
        num_attivazioni: 0
        timing_model:
            type: "ritardando"
            shape: 2.0
        stato_iniziale:
            ottava:           {mean: 5, std: 3}
            registro:         {range: [1, 50], distribution: "uniform"}
            dinamica: 'f'
            durata_armonica:  {range: [20, 30]}
            densita_cluster:  {range: [50, 100]}
            tipo_ritmi:       {choices: ['medi', 'piccoli'], weights: [0.9, 0.1]}
            nonlinear_mode:   {choices: [0, 1], weights: [0.8, 0.2]}
        stato_finale:   
            ottava:           {mean: 7, std: 0}
            registro:         {range: [10, 13], distribution: "uniform"}
            dinamica: 'p'
            durata_armonica:  {range: [10, 15]} 
            densita_cluster:  {range: [15, 20]}
            tipo_ritmi:       {choices: ['medi', 'misti'], weights: [0.2, 0.8]}
            nonlinear_mode:   {choices: [1, 2], weights: [0.4, 0.6]}
