-   nome_sezione: "I. Nascita Lenta di Cluster"
    durata: 140
    ratio_temporale: .8   
    layers:
      - nome_layer: "salita di gamma"
        lifespan: [0, 1]  
        num_attivazioni: 20      
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 2], distribution: "uniform"}
            registro:         {range: [1, 3], distribution: "uniform"}
            durata_armonica:  {range: [30, 40]}
            densita_cluster:  {range: [2, 4]} 
            onset_jitter: { range: [0.0, 0.0] }
            dinamica: 'ff'
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            inviluppo_attacco: 'lineare'
        stato_finale:
            dinamica: 'f'
            ottava:           {range: [3, 8],      interp_shape: 2.0}
            registro:         {range: [1, 20], distribution: "uniform"}
            durata_armonica:  {range: [15, 30]}
            densita_cluster:  {range: [4, 7]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}

      - nome_layer: "scintillii"
        lifespan: [.8, 1]  
        leeway_fine_layer: 5 
        usa_safety_buffer: false 
        num_attivazioni: 40       
        timing_model:
            type: "stochastic"
        stato_iniziale:
            dinamica: 'ppp'
            ottava:           {range: [5, 8], distribution: "uniform"}
            registro:         {range: [1, 8], distribution: "uniform"}
            durata_armonica:  {range: [1, 5]}
            offset_registro: { range: [-3, 3] }
            densita_cluster:  {range: [3, 7]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}
            inviluppo_attacco: 'lineare'
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
        stato_finale:
            dinamica: 
                value: 'f'
                interp_shape: 2.0
            ottava:           {range: [5, 8], distribution: "uniform"}
            registro:         {range: [1, 50], distribution: "uniform"}
            durata_armonica:  {range: [.9, 3]}
            offset_registro: { range: [-10, 10] }
            densita_cluster:  {range: [10, 40]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}
            inviluppo_attacco: 'impulsivo'
            onset_jitter: 10
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
...
---
-   nome_sezione: "II. tutto il monco in festa"
    offset_inizio: 1
    durata: 140
    ratio_temporale: .3   
    inviluppo_sezione: 'continua' 
    layers:
      - nome_layer: "scampanello"
        lifespan: [0, 1]  
        #veteranMode: true
        num_attivazioni: 3      
        timing_model:
            type: "ritardando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 8]}
            registro:         {range: [1, 20]}
            durata_armonica:  {range: [30, 40]}
            densita_cluster:  {range: [70, 100]} 
            onset_jitter: {range: [0.6, 2.6]}
            dinamica: 'mf'
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            inviluppo_attacco: 'impulsivo'
        stato_finale:
            dinamica: 'ff'
            onset_jitter: { range: [0.3, 6.6] }
            ottava:           {range: [3, 8], distribution: "uniform"}
            registro:         {range: [1, 20], distribution: "uniform"}
            durata_armonica:  {range: [15, 30]}
            densita_cluster:  {range: [1, 7]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}

      - nome_layer: "solista"
        lifespan: [.3, 1]  
        num_attivazioni: 3   
        leeway_fine_layer: 30     
        usa_safety_buffer: false            
        timing_model:
            type: "stochastic"
        stato_iniziale:
            ottava:           {range: [3,3]}
            registro:         {distribution: 'normal', mean: 10, std: 2 }
            durata_armonica:  {range: [100,120]}
            densita_cluster:  {range: [1, 2]} 
            dinamica: 'ppp'
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]} 
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            moltiplicatore_durata: { choices: [1.0, 1.1, 1.2] }
            offset_registro: { range: [-1, 1] }
        stato_finale:
            dinamica: 'p'
            ottava:           {range: [3,3]}
            registro:         {distribution: 'normal', mean: 10, std: 20 }
            durata_armonica:  {range: [70, 90]}
            densita_cluster:  {range: [1, 7]}
            offset_registro: { range: [-10, 10] }
      - nome_layer: "Scintillii Acuti e Stocastici"
        leeway_fine_layer: 30     
        usa_safety_buffer: false            
        num_attivazioni: 5
        lifespan: [.8,1]
        timing_model: { type: "stochastic" }
        stato_iniziale:
            moltiplicatore_durata: 
                choices: [3.0, 2.0, 4.0]
            ottava: { range: [7, 8] }
            registro: { mean: 25, std: 10 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.2, 0.8]}
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'impulsivo'
        stato_finale:
            moltiplicatore_durata:
                choices: [1.0, 2.0, 1.0]
            ottava: { range: [8, 9] }
            registro: { mean: 25, std: 2 }
            dinamica: 'p'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.4, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [5, 10] }          
...
---




-   nome_sezione: "III. ripresaglissante"
    durata: 40
    #
    offset_inizio: 20
    #
    layers:
      - nome_layer: "glissando"
        #veteranMode: true
        lifespan: [0, 1] 
        usa_safety_buffer: false 
        leeway_fine_layer: 10     
        num_attivazioni: 8
        timing_model:
            type: "accelerando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [4,5]}
            registro:         {distribution: 'normal', mean: 10, std: 2 }
            offset_registro: { range: [-10, 10] }
            durata_armonica:  {range: [20,30]}
            densita_cluster:  {range: [1, 2]} 
            dinamica: 'ppp'
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]} 
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
        stato_finale:
            dinamica: 'p'
            ottava:           {range: [3,5]}
            registro:         {distribution: 'normal', mean: 10, std: 20 }
            offset_registro: { range: [-40, 40] }
            durata_armonica:  {range: [10, 20]}
            densita_cluster:  {range: [1, 7]}
      - nome_layer: "Scintillii Acuti e Stocastici"
        veteranMode: true
        leeway_fine_layer: 30     
        usa_safety_buffer: false            
        num_attivazioni: 10
        lifespan: [0,.6]
        timing_model: { type: "stochastic" }
        stato_iniziale:
            moltiplicatore_durata:
                choices: [1.0, 2.0, 1.0]
            ottava: { range: [8, 9] }
            registro: { mean: 25, std: 2 }
            dinamica: 'p'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.4, 1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [1, 10] }
        stato_finale:            
            moltiplicatore_durata: 
                choices: [3.0, 2.0, 4.0]
            ottava: { range: [7, 8] }
            registro: { mean: 25, std: 10 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.2, 0.8]}
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'impulsivo'
...
---

-   nome_sezione: "IV. Spippoling"
    offset_inizio: 20
    durata: 140
    ratio_temporale: .75  
    layers:
      - nome_layer: "Scintillii Acuti e Stocastici"
        num_attivazioni: 120
        timing_model: { type: "stochastic" }
        stato_iniziale:
            moltiplicatore_durata: 
                choices: [3.0, 2.0, 4.0]
            ottava: { range: [7, 8] }
            registro: { mean: 25, std: 10 }
            dinamica: 'ppp'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.2, 0.8]}
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'impulsivo'
        stato_finale:
            moltiplicatore_durata:
                choices: [1.0, 2.0, 1.0]
            ottava: { range: [8, 9] }
            registro: { mean: 25, std: 2 }
            dinamica: 'f'
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.4, 0.1] }
            tipo_ritmi:       {choices: ['piccoli', 'medi'], weights: [0.8, 0.2]}
            densita_cluster: { range: [10, 60] }
      - nome_layer: "scampanello"
        lifespan: [0, .4]  
        num_attivazioni: 3      
        timing_model:
            type: "ritardando"
            shape: 2.0
        stato_iniziale:
            ottava:           {range: [0, 8]}
            registro:         {range: [1, 20]}
            durata_armonica:  {range: [30, 40]}
            densita_cluster:  {range: [70, 100]} 
            onset_jitter: {range: [0.6, 2.6]}
            dinamica: 'mf'
            tipo_ritmi:
              explicit_values: [3, 2, 4, 5, 3, 2, 4, 1, 3, 2, 4]
            nonlinear_mode:   {choices: [1, 0], weights: [0.8, 0.2]}
            inviluppo_attacco: 'impulsivo'
        stato_finale:
            dinamica: 'pp'
            onset_jitter: { range: [0.3, 6.6] }
            ottava:           {range: [3, 8], distribution: "uniform"}
            registro:         {range: [1, 20], distribution: "uniform"}
            durata_armonica:  {range: [15, 30]}
            densita_cluster:  {range: [1, 7]}
            nonlinear_mode:   {choices: [1, 0], weights: [0.4, 0.6]}

      - nome_layer: "Scintillii Acuti e Stocastici"
        num_attivazioni: 70
        timing_model: { type: "stochastic" }
        stato_iniziale:
            ottava: { range: [5, 7] }
            registro: { mean: 25, std: 10 }
            dinamica: { choices: ['p', 'mf', 'f'], weights: [0.6, 0.4, 0.0] }
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            densita_cluster: { range: [1, 6] }
            inviluppo_attacco: 'triangolo'
        stato_finale:
            ottava: { range: [4, 5] }
            registro: { mean: 25, std: 40 }
            dinamica: { choices: ['p', 'mf', 'f'], weights: [0.3, 0.4, 0.3] }
            durata_armonica: { range: [0.2, 0.8] }
            nonlinear_mode: { choices: [3] }
            onset_jitter: { range: [0.0, 0.1] }
            densita_cluster: { range: [1, 6] }


...
